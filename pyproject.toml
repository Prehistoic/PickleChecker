[tool.poetry]
name = "picklechecker"
version = "1.0.0"
description = "A security analysis tool for scanning Python pickle files and ML models for potential security threats "
readme = "README.md"
authors = ["Prehistoic <lacotematthieu@gmail.com>"]
license = "BSD-3-Clause"
homepage = "https://github.com/Prehistoic/PickleChecker"
repository = "https://github.com/Prehistoic/PickleChecker"
keywords = ["security", "pickle", "ml", "scanner"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
packages = [{ include = "picklechecker" }]
exclude = ["tests/*", "Makefile"]

[tool.poetry.scripts]
picklechecker = "picklechecker.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
huggingface-hub = "^1.0.1"
click = "^8.3.0"
click-option-group = "^0.5.9"
python-dotenv = "^1.2.1"
rich = "^14.2.0"
reportlab = "^4.4.4"
py7zr = "^1.0.0"
numpy = ">=1.24.0,<2.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
bandit = { version = "1.9.2", extras = ["toml"] }
mypy = "^1.5.0"

[tool.poetry.group.dev.dependencies]
dunamai = "^1.18.0"
pre-commit = ">=3.3.3,<5.0.0"
black = ">=23.7,<26.0"

[tool.poetry.group.prod.dependencies]
dunamai = "^1.18.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=picklechecker --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true