[tool.poetry]
name = "picklechecker"
version = "1.0.0"
description = "Yet Another Pickle Files Scanner"
readme = "README.md"
authors = ["Prehistoic <lacotematthieu@gmail.com>"]
license = "BSD-3-Clause"
homepage = "https://github.com/Prehistoic/PickleChecker"
repository = "https://github.com/Prehistoic/PickleChecker"
keywords = ["security", "pickle", "ml", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
packages = [{ include = "picklechecker" }]

[tool.poetry.scripts]
picklechecker = "picklechecker.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
huggingface-hub = "^1.0.1"
click = "^8.3.0"
click-option-group = "^0.5.9"
python-dotenv = "^1.2.1"
rich = "^14.2.0"
reportlab = "^4.4.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.285"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=picklechecker --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true